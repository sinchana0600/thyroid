<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ThyroDetect Doctor Portal</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="unique-auth-body doctor-forgot-password-page">
    <!-- Unique Doctor Forgot Password Container -->
    <div class="doctor-forgot-password-unique-container">
        <!-- Animated Medical Background -->
        <div class="medical-bg">
            <div class="medical-wave medical-wave-1"></div>
            <div class="medical-wave medical-wave-2"></div>
            <div class="medical-wave medical-wave-3"></div>
            
            <!-- Floating Medical Icons -->
            <div class="medical-icon medical-icon-1">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
            </div>
            <div class="medical-icon medical-icon-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14,2 14,8 20,8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10,9 9,9 8,9"></polyline>
                </svg>
            </div>
            <div class="medical-icon medical-icon-3">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
            </div>
        </div>
        
        <!-- Doctor Forgot Password Card -->
        <div class="doctor-forgot-password-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="logo-section">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logo-icon">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <div>
                        <h2>ThyroDetect</h2>
                        <p>Doctor Portal - Reset Password</p>
                    </div>
                </div>
                
                <a href="login.html" class="close-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </a>
            </div>

            <!-- Step 1: Enter Email -->
            <div id="step1" class="auth-form">
                <div class="step-info">
                    <h3>Find Your Doctor Account</h3>
                    <p>Enter your registered email address</p>
                </div>
                
                <form id="emailForm" class="modern-form">
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <path d="M22 6l-10 7L2 6"></path>
                            </svg>
                        </div>
                        <input type="email" id="email" name="email" placeholder="Doctor Email Address" required>
                        <label>Email</label>
                    </div>
                    
                    <button type="submit" class="submit-btn">
                        <span>Find Account</span>
                        <div class="btn-arrow">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </button>
                </form>
            </div>

            <!-- Step 2: Answer Security Question -->
            <div id="step2" class="auth-form" style="display: none;">
                <div class="step-info">
                    <h3>Security Verification</h3>
                    <p>Answer your security question to reset password</p>
                </div>
                
                <form id="securityForm" class="modern-form">
                    <div class="security-question-display">
                        <label>Security Question 1:</label>
                        <div id="securityQuestionLabel1" class="question-text"></div>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"></path>
                            </svg>
                        </div>
                        <input type="text" id="securityAnswer1" name="security_answer_1" placeholder="Answer to question 1" required>
                        <label>Security Answer 1</label>
                    </div>
                    
                    <div class="security-question-display">
                        <label>Security Question 2:</label>
                        <div id="securityQuestionLabel2" class="question-text"></div>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"></path>
                            </svg>
                        </div>
                        <input type="text" id="securityAnswer2" name="security_answer_2" placeholder="Answer to question 2" required>
                        <label>Security Answer 2</label>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <input type="password" id="newPassword" name="new_password" placeholder="New Password" required minlength="6">
                        <label>New Password</label>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm Password" required minlength="6">
                        <label>Confirm Password</label>
                    </div>
                    
                    <button type="submit" class="submit-btn">
                        <span>Reset Password</span>
                        <div class="btn-arrow">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </button>
                </form>
            </div>

            <!-- Links -->
            <div class="form-footer">
                <a href="login.html" class="back-link">← Back to Doctor Login</a>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="../js/doctor-forgot-password.js"></script>
</body>
</html>
